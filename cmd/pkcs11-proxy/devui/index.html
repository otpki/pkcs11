<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pkcs11-proxy · dev</title>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --panel-edge: #30363d;
    --text: #e6edf3; --dim: #8b949e; --accent: #58a6ff;
    --ok: #3fb950; --warn: #d29922; --bad: #f85149; --idle: #6e7681;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 14px/1.5 -apple-system, "SF Pro", "Segoe UI", system-ui, sans-serif;
    padding: 24px; max-width: 1100px; margin: 0 auto;
  }
  header { display: flex; align-items: baseline; gap: 14px; margin-bottom: 20px; flex-wrap: wrap; }
  h1 { font-size: 18px; font-weight: 600; letter-spacing: .02em; }
  h1 .tag { color: var(--accent); font-weight: 400; }
  .meta { color: var(--dim); font-size: 12px; }
  .meta b { color: var(--text); font-weight: 500; }
  #poll { margin-left: auto; font-size: 12px; color: var(--dim); display: flex; align-items: center; gap: 6px; }
  #poll .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
  #poll.stale .dot { background: var(--bad); }
  #poll.paused .dot { background: var(--idle); }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 14px; }
  .card { background: var(--panel); border: 1px solid var(--panel-edge); border-radius: 10px; padding: 16px; }
  .card h2 { font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .rev { color: var(--dim); font-weight: 400; font-size: 12px; }
  .badge {
    margin-left: auto; font-size: 11px; font-weight: 600; text-transform: uppercase;
    letter-spacing: .06em; padding: 3px 10px; border-radius: 999px;
  }
  .badge.active    { color: var(--ok);   background: rgba(63,185,80,.12);  border: 1px solid rgba(63,185,80,.4); }
  .badge.activating{ color: var(--warn); background: rgba(210,153,34,.12); border: 1px solid rgba(210,153,34,.4); }
  .badge.inactive  { color: var(--idle); background: rgba(110,118,129,.12);border: 1px solid rgba(110,118,129,.4); }
  .act { font-size: 12px; color: var(--dim); margin: -6px 0 12px; }
  .act b { color: var(--text); font-weight: 500; }
  .meters { display: grid; gap: 9px; }
  .meter { display: grid; grid-template-columns: 128px 1fr 74px; align-items: center; gap: 10px; font-size: 12px; }
  .meter .name { color: var(--dim); }
  .meter .bar { height: 7px; border-radius: 4px; background: #21262d; overflow: hidden; }
  .meter .fill { height: 100%; border-radius: 4px; background: var(--accent); transition: width .35s ease; }
  .meter.hot .fill { background: var(--warn); }
  .meter.max .fill { background: var(--bad); }
  .meter .val { font-family: ui-monospace, "SF Mono", Menlo, monospace; text-align: right; }
  .subgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin-top: 12px; }
  .stat { background: #1c2129; border-radius: 8px; padding: 9px 12px; }
  .stat .k { font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: .05em; }
  .stat .v { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 15px; }
  canvas.spark { width: 100%; height: 36px; margin-top: 12px; }
  .spark-label { font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: .05em; margin-top: 10px; }
  .empty { color: var(--dim); padding: 40px 0; text-align: center; }
  footer { margin-top: 22px; font-size: 11px; color: var(--dim); }
  code { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: .92em; }
</style>
</head>
<body>
<header>
  <h1>pkcs11-proxy <span class="tag">dev console</span></h1>
  <div class="meta" id="server-meta">connecting…</div>
  <div id="poll"><span class="dot"></span><span id="poll-label">live</span></div>
</header>
<main class="grid" id="targets"></main>
<footer>
  Read-only operational view · all figures are secret-free broker counters ·
  source <code>/dev/api/status</code> · polls every 1s, paused while tab hidden
</footer>
<script>
const HISTORY = 120;                       // samples kept per target
const history = new Map();                 // id -> [{t, active, opened}]
const sparkCtx = new Map();                // id -> canvas 2d context

const el = id => document.getElementById(id);
const fmtBytes = n => n < 1024 ? n + " B"
  : n < 1048576 ? (n/1024).toFixed(1) + " KiB"
  : (n/1048576).toFixed(1) + " MiB";
const fmtAgo = iso => {
  if (!iso || iso.startsWith("0001-")) return "—";
  const s = Math.max(0, (Date.now() - Date.parse(iso)) / 1000);
  if (s < 60) return Math.floor(s) + "s ago";
  if (s < 3600) return Math.floor(s/60) + "m ago";
  return Math.floor(s/3600) + "h ago";
};
const fmtUntil = iso => {
  if (!iso || iso.startsWith("0001-")) return "";
  const s = (Date.parse(iso) - Date.now()) / 1000;
  return s > 0 ? " · retry in " + Math.ceil(s) + "s" : "";
};

function meter(name, used, max) {
  const capped = max > 0;
  const pct = capped ? Math.min(100, 100 * used / max) : 0;
  const cls = capped && used >= max ? "max" : capped && used >= 0.8 * max ? "hot" : "";
  return `<div class="meter ${cls}">
    <span class="name">${name}</span>
    <span class="bar"><span class="fill" style="width:${pct}%"></span></span>
    <span class="val">${used}${capped ? " / " + max : ""}</span>
  </div>`;
}

function activationLine(a) {
  let parts = [`gen <b>${a.generation}</b>`];
  if (a.activated_by) parts.push(`by <b>${a.activated_by.slice(0, 24)}${a.activated_by.length > 24 ? "…" : ""}</b>`);
  if (a.activated_at && !a.activated_at.startsWith("0001-")) parts.push(fmtAgo(a.activated_at));
  if (a.failed_at && !a.failed_at.startsWith("0001-")) parts.push(`last failure ${fmtAgo(a.failed_at)}`);
  parts.push(fmtUntil(a.retry_after));
  return parts.filter(Boolean).join(" · ");
}

function drawSpark(id) {
  const ctx = sparkCtx.get(id), h = history.get(id);
  if (!ctx || !h || h.length < 2) return;
  const {canvas} = ctx, w = canvas.width, hh = canvas.height;
  ctx.clearRect(0, 0, w, hh);
  const max = Math.max(1, ...h.map(p => p.opened));
  const step = w / (HISTORY - 1), x0 = w - step * (h.length - 1);
  ctx.strokeStyle = "#58a6ff"; ctx.lineWidth = 1.5; ctx.beginPath();
  h.forEach((p, i) => {
    const x = x0 + i * step, y = hh - 2 - (p.active / max) * (hh - 4);
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  });
  ctx.stroke();
}

function render(data) {
  el("server-meta").innerHTML =
    `<b>${data.server.address}</b> · up <b>${data.server.uptime_seconds}s</b> · ` +
    `${data.server.go_version} · pid ${data.server.pid}`;
  const root = el("targets");
  const seen = new Set();

  for (const t of data.targets) {
    seen.add(t.id);
    const s = t.stats, a = s.activation;
    let h = history.get(t.id);
    if (!h) history.set(t.id, h = []);
    h.push({t: Date.now(), active: s.physical_active, opened: s.physical_opened});
    if (h.length > HISTORY) h.shift();

    let card = document.getElementById("card-" + t.id);
    if (!card) {
      card = document.createElement("section");
      card.className = "card"; card.id = "card-" + t.id;
      card.innerHTML = `
        <h2><span class="tid"></span><span class="rev"></span><span class="badge"></span></h2>
        <div class="act"></div>
        <div class="meters"></div>
        <div class="subgrid"></div>
        <div class="spark-label">physical sessions in use</div>
        <canvas class="spark" width="660" height="36"></canvas>`;
      root.appendChild(card);
      sparkCtx.set(t.id, card.querySelector("canvas").getContext("2d"));
    }
    card.querySelector(".tid").textContent = t.id;
    card.querySelector(".rev").textContent = "rev " + t.revision;
    const badge = card.querySelector(".badge");
    badge.className = "badge " + a.state;
    badge.textContent = a.state;
    card.querySelector(".act").innerHTML = activationLine(a);
    card.querySelector(".meters").innerHTML =
      meter("physical opened", s.physical_opened, s.max_physical) +
      meter("physical in use",  s.physical_active, s.max_physical) +
      meter("pinned",           s.pinned_sessions, s.max_pinned) +
      meter("queued requests",  s.queued_requests, s.max_queued) +
      meter("virtual sessions", s.virtual_sessions, s.max_virtual);
    card.querySelector(".subgrid").innerHTML = `
      <div class="stat"><div class="k">clients</div><div class="v">${s.authenticated_clients} authed / ${s.clients}</div></div>
      <div class="stat"><div class="k">dedup ledger</div><div class="v">${fmtBytes(s.dedup_bytes)}${s.max_dedup_bytes ? " / " + fmtBytes(s.max_dedup_bytes) : ""} · ${s.dedup_entries} ops</div></div>`;
    drawSpark(t.id);
  }
  for (const card of [...root.children]) {
    const id = card.id.replace("card-", "");
    if (!seen.has(id)) { card.remove(); history.delete(id); sparkCtx.delete(id); }
  }
  if (!data.targets.length) root.innerHTML = `<div class="empty">no targets configured</div>`;
}

let timer;
async function poll() {
  try {
    const r = await fetch("/dev/api/status", {cache: "no-store"});
    if (!r.ok) throw new Error("http " + r.status);
    render(await r.json());
    el("poll").className = ""; el("poll-label").textContent = "live";
  } catch (e) {
    el("poll").className = "stale"; el("poll-label").textContent = "disconnected";
  }
}
function schedule() { clearTimeout(timer); if (!document.hidden) { poll(); timer = setTimeout(schedule, 1000); } }
document.addEventListener("visibilitychange", () => {
  el("poll").className = document.hidden ? "paused" : "";
  el("poll-label").textContent = document.hidden ? "paused" : "live";
  schedule();
});
schedule();
</script>
</body>
</html>
