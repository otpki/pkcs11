name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly rescan picks up new CodeQL queries.
    - cron: "24 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    permissions:
      contents: read
      security-events: write
    uses: otpki/.github/.github/workflows/reusable-codeql.yml@v1
    with:
      languages: |
        [
          {"language":"actions","build-mode":"none"},
          {"language":"c-cpp","build-mode":"none"},
          {"language":"go","build-mode":"manual"},
          {"language":"rust","build-mode":"none"},
          {"language":"javascript-typescript","build-mode":"none"}
        ]
      # Scan our GitHub Actions workflows themselves.
      # The repo contains real C code used by the PKCS#11 bridge/loaders.
      # Go needs explicit builds because the repo supports multiple
      # mutually exclusive CGO/PureGo/platform implementations.
      # Rust analysis reads the Cargo project without a full build.
      # javascript-typescript covers the embedded development UI.
      build-commands: |
        set -euxo pipefail

        # build.go is excluded from normal package builds with
        # //go:build ignore, but it drives release builds.
        go build -o "${RUNNER_TEMP}/pkcs11-build" build.go

        # Normal Linux/amd64 build using the native CGO PKCS#11 backend.
        CGO_ENABLED=1 \
          go build -buildvcs=false ./...

        # Automatic PureGo path selected when CGO is disabled.
        CGO_ENABLED=0 \
          go build -buildvcs=false ./...

        # Explicit PureGo build tag while CGO remains available.
        CGO_ENABLED=1 \
          go build -buildvcs=false -tags=pkcs11_purego ./...

        # Pull Windows-only PureGo implementation files into the database.
        CGO_ENABLED=0 \
        GOOS=windows \
        GOARCH=amd64 \
          go build -buildvcs=false ./...
