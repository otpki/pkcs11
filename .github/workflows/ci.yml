name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
      - name: Verify pinned OASIS 3.2 headers
        working-directory: raw/internal/cryptoki/oasis/3.2
        run: sha256sum -c MANIFEST.sha256
      - name: Validate native and Windows LLP64 ABI layouts
        run: |
          cc -std=c11 -Wall -Wextra -Werror -Iraw/internal/cryptoki \
            -fsyntax-only raw/internal/cryptoki/abi_layout_test.c
          clang --target=x86_64-pc-windows-msvc -std=c11 \
            -Wall -Wextra -Werror -fdeclspec -DCRYPTOKI_FORCE_WIN32 \
            -Iraw/internal/cryptoki -fsyntax-only \
            raw/internal/cryptoki/abi_layout_test.c
          clang --target=aarch64-pc-windows-msvc -std=c11 \
            -Wall -Wextra -Werror -fdeclspec -DCRYPTOKI_FORCE_WIN32 \
            -Iraw/internal/cryptoki -fsyntax-only \
            raw/internal/cryptoki/abi_layout_test.c
      - run: go generate ./...
      - run: git diff --exit-code
      - name: Test default cgo backend
        run: CGO_ENABLED=1 go test ./...
      - name: Test automatic PureGo fallback
        run: CGO_ENABLED=0 go test ./...
      - name: Force PureGo while cgo is enabled
        run: CGO_ENABLED=1 go test -tags=pkcs11_purego ./...
      - name: Race test default backend
        run: CGO_ENABLED=1 go test -race ./...
      - name: Race test forced PureGo backend
        run: CGO_ENABLED=1 go test -race -tags=pkcs11_purego ./...
      - name: Vet default cgo backend
        run: CGO_ENABLED=1 go vet ./...
      - name: Vet PureGo fallback
        run: CGO_ENABLED=0 go vet ./...
      - name: Vet forced PureGo backend
        run: CGO_ENABLED=1 go vet -tags=pkcs11_purego ./...
      - name: Verify backend source separation
        run: go test -run TestNativeBackendsRemainSeparated .

  purego-cross-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
      - run: go build -buildvcs=false ./...
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
