name: ci

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

# cancel previous runs on the same PR, but wait for master builds to finish
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  native:
    name: Native PKCS11 client
    uses: ./.github/workflows/native.yml

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
      - name: format
        run: just format-check
      - name: lint
        run: just lint
      - name: go mod tidy
        run: just tidy
      - name: go generate
        run: just gen
      - name: working tree stays clean
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "Generation, tidy, or formatting left changes:"
            git status --porcelain
            git diff
            exit 1
          fi
      - name: govulncheck
        run: just vulncheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
        with:
          tools: 'false'
      - name: Build public proxy without private credentials
        run: |
          go run build.go
          dist/pkcs11-proxy --version
          dist/pkcs11-proxy vendors
      - name: Verify pinned headers and ABI layouts
        run: just abi-check
      - name: Test default cgo backend
        run: just test
      - name: Test automatic PureGo fallback
        run: just test-nocgo
      - name: Force PureGo while cgo is enabled
        run: just test-purego
      - name: Race test default backend
        run: just test-race
      - name: Race test forced PureGo backend
        run: just test-race-purego
      - name: Vet all backend combinations
        run: just vet
      - name: Verify backend source separation
        run: just verify-backends

  purego-cross-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
        with:
          tools: 'false'
      - run: just cross-build ${{ matrix.goos }} ${{ matrix.goarch }}

  conformance:
    name: ${{ matrix.provider }} conformance
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - provider: softhsm2
            dockerfile: vendors/softhsm/conformance/docker/Dockerfile
            image: otpki/conformance-softhsm2-cgo
            scope: softhsm2-cgo
          - provider: kryoptic-pqc
            dockerfile: vendors/kryoptic/conformance/docker/Dockerfile
            image: otpki/conformance-kryoptic-cgo
            scope: kryoptic-cgo
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
        with:
          tools: 'false'
      - name: Build and vet the conformance launcher
        working-directory: conformance/testcontainers
        run: |
          go build ./...
          go vet ./...
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build the conformance image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: conformance
          load: true
          tags: ${{ matrix.image }}:ci
          build-args: |
            PKCS11_BACKEND=cgo
          provenance: false
          # The provider's source build dominates image time, mode=max caches
          # every stage so an unchanged pinned revision reuses the compiled HSM.
          cache-from: type=gha,scope=${{ matrix.scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.scope }}
      - name: Run the ${{ matrix.provider }} conformance suite
        run: just conformance ${{ matrix.provider }} ${{ matrix.image }}:ci
      - name: Upload conformance reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: conformance-${{ matrix.provider }}-cgo
          path: reports/conformance/
          if-no-files-found: ignore

  integration:
    name: ${{ matrix.vendor }} integration tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - vendor: softhsm
            scope: softhsm2-cgo
          - vendor: kryoptic
            scope: kryoptic-cgo
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
        with:
          tools: 'false'
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build the integration image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: vendors/${{ matrix.vendor }}/conformance/docker/Dockerfile
          target: integration
          load: true
          tags: otpki/integration-${{ matrix.vendor }}-cgo:ci
          provenance: false
          # Shares the conformance scope. the vendored module build is reused
          # from the conformance job's cache on warm runs.
          cache-from: type=gha,scope=${{ matrix.scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.scope }}
      - name: Run module-gated integration tests
        run: just integration ${{ matrix.vendor }} ci
