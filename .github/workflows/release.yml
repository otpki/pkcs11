name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native:
    name: Native PKCS11 client
    uses: ./.github/workflows/native.yml # zizmor: ignore[self-repository] actionlint rejects `$/` until rhysd/actionlint#732 ships

  # macOS builds stay native. Go's darwin link needs libresolv and the
  # Security/CoreFoundation frameworks, which zig's stub libSystem does not
  # provide. arm64 lands on macos-15, amd64 on macos-15-intel.
  build:
    name: pkcs11-proxy ${{ matrix.goos }}/${{ matrix.goarch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: windows, goarch: amd64, zig_target: x86_64-windows-gnu,     ext: ".exe", runner: ubuntu-latest }
          - { goos: windows, goarch: arm64, zig_target: aarch64-windows-gnu,    ext: ".exe", runner: ubuntu-latest }
          - { goos: darwin,  goarch: arm64, zig_target: "",                     ext: "",     runner: macos-15 }
          - { goos: darwin,  goarch: amd64, zig_target: "",                     ext: "",     runner: macos-15-intel }
    runs-on: ${{ matrix.runner }}
    env:
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: otpki
          repositories: |
            ${{ github.event.repository.name }}
            pkcs11-private-vendors
          permission-contents: read
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
          token: ${{ steps.app-token.outputs.token }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: false
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        if: matrix.zig_target != ''
        with:
          version: 0.16.0
          use-cache: false
      - name: Build host helper
        run: go build -o "$RUNNER_TEMP/build" build.go
      - name: Build
        env:
          GIT_TAG: ${{ github.ref_name }}
          CGO_ENABLED: '1'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          if [ -n "${{ matrix.zig_target }}" ]; then
            export CC="zig cc -target ${{ matrix.zig_target }}"
            export CXX="zig c++ -target ${{ matrix.zig_target }}"
          fi
          "$RUNNER_TEMP/build"
          mv "dist/pkcs11-proxy${{ matrix.ext }}" "dist/pkcs11-proxy_${{ matrix.goos }}_${{ matrix.goarch }}${{ matrix.ext }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bin-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/pkcs11-proxy_*
  linux:
    needs: native
    name: Linux binaries and packages (amd64 + arm64)
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: otpki
          repositories: |
            ${{ github.event.repository.name }}
            pkcs11-private-vendors
          permission-contents: read
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: true
          token: ${{ steps.app-token.outputs.token }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: false
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0
          use-cache: false
      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.18.2
          install-only: true
      - name: Download native libraries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: native-lib-linux*
          path: .native-release
          merge-multiple: true
      - name: Build Linux release with GoReleaser
        run: goreleaser release --clean --skip=publish
      - name: Stage Linux release assets
        run: |
          mkdir -p dist/release
          for arch in amd64 arm64; do
            cp dist/glibc_linux_"$arch"*/pkcs11-proxy "dist/release/pkcs11-proxy_linux_$arch"
          done
          cp dist/pkcs11-proxy_*.deb dist/pkcs11-proxy_*.rpm dist/pkcs11-proxy_*.apk dist/pkcs11-proxy_*.pkg.tar.zst dist/release/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-release
          path: dist/release/*
  docker:
    name: Container image (linux/amd64+arm64)
    needs: [build, linux]
    # packages: GHCR mirror; id-token: cosign keyless signing in the reusable.
    permissions:
      contents: read
      packages: write
      checks: write
      id-token: write
    uses: otpki/.github/.github/workflows/reusable-docker-publish.yml@v1
    with:
      registry_url: ${{ vars.REGISTRY_URL_PUBLIC }}
      image_prefix: otpki
      app: pkcs11-proxy
      image_name: pkcs11-proxy
      extra_tag: ${{ github.ref_name }}
      provenance: true
      ghcr-mirror: true
      # The release build bundles the private vendor module from the pinned
      # submodule — the only place this repo still needs the app token.
      private-repositories: pkcs11-private-vendors
      cache_from: |
        type=gha,scope=otpki-pkcs11-proxy
      cache_to: |
        type=gha,mode=max,scope=otpki-pkcs11-proxy
    secrets:
      REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
      REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
      GH_APP_CLIENT_ID: ${{ secrets.GH_APP_CLIENT_ID }}
      GH_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}
  publish:
    name: Publish release
    permissions:
      contents: write
    needs: [build, linux, docker, native]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bin-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-release
          path: dist
      - name: Download native libraries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: native-lib-*
          path: dist
          merge-multiple: true
      - name: Download resolved Rust dependency lock
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-dependency-lock
          path: native-lock
      - name: Stage native documentation and dependency lock
        run: |
          cp native-lock/Cargo.lock dist/pkcs11-proxy-client.Cargo.lock
          cp native/client.example.yaml dist/pkcs11-proxy-client.example.yaml
          cp native/README.md dist/pkcs11-proxy-client.README.md
      - name: Single checksum file across all platforms
        working-directory: dist
        run: |
          sha256sum pkcs11-proxy_* pkcs11-proxy-client_* pkcs11-proxy-client.* > checksums.txt
          cat checksums.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        # RELEASE_NOTES.md is prepended above the generated changelog; the
        # changelog itself is categorized by .github/release.yml.
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --notes-file .github/RELEASE_NOTES.md \
            --generate-notes \
            --verify-tag
