changelog:
  exclude:
    labels:
      - duplicate
      - wontfix
      - invalid
    authors:
      - dependabot
  categories:
    - title: New features
      labels:
        - enhancement
    - title: Bug fixes
      labels:
        - bug
    - title: Dependency updates
      labels:
        - dependencies
    - title: Documentation
      labels:
        - documentation
    - title: Other changes
      labels:
        - "*"
