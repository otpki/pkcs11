version: 2

updates:
  # Go dependencies across both modules.
  - package-ecosystem: gomod
    directories:
      - /
      - /conformance/testcontainers
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # batch minor/patch bumps into one PR, majors open individually.
      go-dependencies:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # The small native client has a separate Rust dependency graph.
  - package-ecosystem: cargo
    directory: /native
    schedule:
      interval: weekly
    groups:
      native-client:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # GitHub Actions pinned in .github/workflows and .github/actions.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

# Tool versions pinned in .aqua.yaml (golangci-lint, govulncheck) are not an
# ecosystem dependabot understands
